[project]
name = "kitchen-clock"
version = "0.2.0"
description = "Kitchen-clock main unit: BLE GATT client + PyGame renderer (Path A — same code on host dev and Pi runtime; see ADR 0011)."
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.5",
    "dbus-python>=1.3",
    "bleak>=0.21",
]

[project.scripts]
kitchen-clock = "kitchen_clock.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kitchen_clock*"]
