[project]
name = "kitchen-clock"
version = "0.3.0"
description = "Kitchen-clock main unit: BLE GATT client + two renderers (PyGame on host dev, Fbdev via /dev/fb0 + Pillow on the Pi runtime; Path A — see ADR 0011)."
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.5",
    "Pillow>=10.0",
    "dbus-python>=1.3",
    "bleak>=0.21",
]

[project.scripts]
kitchen-clock = "kitchen_clock.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kitchen_clock*"]

