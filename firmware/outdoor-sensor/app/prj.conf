# Project configuration for `firmware/outdoor-sensor/app`.
#
# Adds Bluetooth LE + USB-CDC console + BME280 sensor driver on top
# of the board defaults for `xiao_ble` (Zephyr 3.7 LTS — Seeed
# XIAO nRF52840 registers under the legacy `xiao_ble` board name).

# Bluetooth LE core and role
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="kclock"

# I²C bus + BME280 sensor driver bound via DT_ALIAS(bme280). The
# BME280 driver takes transport (I²C vs SPI) from the devicetree
# and does not need a separate CONFIG_BME280_I2C=y in Zephyr 3.7.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y

# Console / printk output. We deliberately drive printk over the
# XIAO's external UART0 pads (P1.11 TX / P1.12 RX) instead of the
# on-board USB-CDC port. Two reasons:
#
#   - On host Linux, the CDC-ACM endpoint can stick in a half-open
#     state across an XIAO reset, swallowing subsequent console
#     output until the user unplugs/replugs or `udevadm trigger`.
#     A USB-serial FTDI / CP2102 / CH340 adapter wired to P1.11 / P1.12
#     re-enumerates cleanly on every reset.
#   - The CDC port is then free for the BLE HCI trace + mcumgr
#     transport (`zephyr,bt-c2h-uart = &usb_cdc_acm_uart` in the
#     overlay) so the two streams do not share a single physical
#     endpoint.
#
# Console routing (which UART, which pins) is set in the overlay
# via `chosen { zephyr,console = &uart0; }` and `&uart0 { status }
# { pinctrl-0 = <&uart0_default>; … }`. The board-included
# `uart0_default` pinctrl already maps P1.11 → TX, P1.12 → RX.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Keep the USB-CDC device class around for BLE HCI / mcumgr while
# we are not driving printk through it.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# UF2 build output for the XIAO bootloader; if this symbol is
# renamed in a later Zephyr revision, remove this line and rely on
# `west flash -r uf2` to convert HEX → UF2 at flash time.
CONFIG_BUILD_OUTPUT_UF2=y
