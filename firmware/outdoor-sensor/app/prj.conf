# Project configuration for `firmware/outdoor-sensor/app`.
#
# Adds Bluetooth LE + Environmental Sensing Service + USB-CDC
# console + BME280 sensor driver on top of the board defaults for
# `xiao_nrf52840` (Zephyr 3.7 LTS).

# Bluetooth LE core and role
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="kclock"
CONFIG_BT_DEVICE_APPEARANCE=0x0000

# Standard Environmental Sensing Service (ESS) for temperature and
# humidity. nRF Connect recognises these and renders them cleanly.
CONFIG_BT_ESS=y

# I²C bus + BME280 sensor driver bound via DT_ALIAS(bme280).
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_BME280_I2C=y

# USB-CDC console on the XIAO's USB-C port (replaces the UART
# console, which the XIAO does not break out as a separate header
# pin pair).
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_CONSOLE=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# UF2 build output for the XIAO nRF52840 bootloader; if this symbol
# is renamed in a later Zephyr revision, remove this line and rely on
# `west flash -r uf2` to convert HEX → UF2 at flash time.
CONFIG_BUILD_OUTPUT_UF2=y
